[project]
name = "scraper"
version = "0.1.0"
description = "High-performance Telegram and Telegra.ph media crawler and scraper"
readme = "README.md"
authors = [
    { name = "Tyler", email = "thhdragon@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "telethon>=1.45.0",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
]


[project.scripts]
scraper = "scraper.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]

